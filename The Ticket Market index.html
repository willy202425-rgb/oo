<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>The Ticket Market</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;700;800&display=swap"><style id="css">@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--hd:"Alfa Slab One",Rockwell,Georgia,serif;--bd:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;
--bg:#0a0724;--panel:#17114a;--panel2:rgba(255,255,255,.09);--chip:#1c1650;--ink:#fff;--mut:#c4bffa;--line:rgba(255,255,255,.16);--track:rgba(255,255,255,.10);
--gold:#2ee6ff;--teal:#2df5a8;
--c1:#ff3d8b;--c2:#ffa62b;--c3:#2df5a8;--c4:#2ee6ff;--c5:#a77bff;--c6:#ff6b6b;
--grad:linear-gradient(90deg,#ff3d8b,#ffa62b,#2df5a8,#2ee6ff,#a77bff,#ff3d8b)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--bd);font-size:16px}
body::before,body::after{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none}
body::before{background:radial-gradient(40% 36% at 15% 18%,rgba(255,61,139,.45),transparent 70%),radial-gradient(38% 34% at 88% 12%,rgba(46,230,255,.38),transparent 70%),radial-gradient(44% 40% at 70% 92%,rgba(167,123,255,.45),transparent 70%);animation:drift 24s ease-in-out infinite alternate}
body::after{background:radial-gradient(34% 30% at 82% 70%,rgba(255,166,43,.22),transparent 70%),radial-gradient(30% 30% at 10% 85%,rgba(45,245,168,.22),transparent 70%);animation:drift2 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(5%,4%,0) rotate(6deg) scale(1.08)}}
@keyframes drift2{to{transform:translate3d(-6%,-3%,0) rotate(-5deg) scale(1.1)}}
.wrap{max-width:none;margin:0;padding:0;display:block}
.wrap>.auth{width:min(470px,calc(100% - 32px))}
input,button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:0}
input::placeholder{color:#a9a3e6}
button{cursor:pointer;font-weight:800;transition:transform .15s,box-shadow .2s,filter .15s}
button:hover{filter:brightness(1.15)}button:active{transform:scale(.96)}
input:focus{outline:0;border-color:var(--c4);box-shadow:0 0 0 3px rgba(46,230,255,.35)}
.brand{display:flex;align-items:center;gap:16px}
.brand .bt{font-size:52px;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(255,61,139,.8))}
@keyframes bob{50%{transform:translateY(-6px) rotate(-8deg)}}
.brand b{display:block;font-family:var(--hd);font-weight:400;font-size:clamp(30px,7vw,48px);line-height:1;background:var(--grad);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 8s linear infinite;filter:drop-shadow(0 0 14px rgba(167,123,255,.55))}
@keyframes flow{to{background-position:200% 0}}
.brand small{color:var(--mut);font-weight:800;letter-spacing:.04em}
.panel,.card{position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04)),rgba(23,17,74,.72);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:0 18px 50px rgba(5,2,30,.55),inset 0 1px 0 rgba(255,255,255,.18)}
.panel::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--grad);background-size:200% 100%;animation:flow 10s linear infinite;box-shadow:0 0 18px rgba(167,123,255,.8)}
body.ed .panel{border-style:dashed;border-color:rgba(255,255,255,.35)}
h2{margin:0 0 14px;font-family:var(--hd);font-weight:400;font-size:21px;color:#fff;text-shadow:0 0 14px rgba(167,123,255,.7)}
h2 button{font-family:var(--bd);text-shadow:none}
.top{position:sticky;top:8px;z-index:6;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(18,12,60,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:10px 16px;box-shadow:0 10px 30px rgba(5,2,30,.5)}
.sp{flex:1}
.who{font-family:var(--hd);font-size:19px;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lnk{background:none;border:0;color:var(--mut);text-decoration:underline;padding:4px}
.top .ed1{background:linear-gradient(135deg,var(--c3),var(--c4));color:#06133a;border:0;box-shadow:0 0 18px rgba(46,230,255,.5)}
.top .ed1.on{background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 0 18px rgba(255,61,139,.6)}
.mut{color:var(--mut)}
.tabs{display:flex;gap:10px;flex-wrap:wrap}
.tab{border-radius:99px;padding:11px 24px;font-weight:900;border:2px solid var(--cc,var(--c4));background:rgba(255,255,255,.05)}
.tab.on{background:var(--cc,var(--c4));color:#07123a;box-shadow:0 0 24px var(--cc,var(--c4));transform:translateY(-2px)}
.tab.over{outline:3px dashed var(--c2)}
.note{background:var(--panel2);border-radius:16px;padding:12px 16px;color:var(--mut)}
.srow{display:grid;grid-template-columns:160px 1fr 56px;gap:12px;align-items:center;margin-bottom:14px}
body.ed .srow{grid-template-columns:160px 1fr 56px 56px}
.sn,.sv{font-weight:900;font-size:17px}.sv{text-align:right;font-family:var(--hd);font-weight:400;font-size:19px}
.srow.me .sn{color:var(--c1);text-shadow:0 0 12px rgba(255,61,139,.7)}
.track{height:22px;background:var(--track);border-radius:99px;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.4)}
.track i{display:block;height:100%;border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1);background:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 10px,transparent 10px 20px),var(--cc,var(--c4));background-size:28px 28px,auto;animation:stripe 1.4s linear infinite;box-shadow:0 0 16px var(--cc,var(--c4))}
@keyframes stripe{to{background-position:28px 0,0 0}}
.srow.me .track i{background:repeating-linear-gradient(45deg,rgba(255,255,255,.3) 0 10px,transparent 10px 20px),linear-gradient(90deg,var(--c1),var(--c2));background-size:28px 28px,auto;box-shadow:0 0 18px rgba(255,61,139,.8)}
.srow input{width:100%;padding:6px 8px}.x{padding:6px 10px;color:var(--mut)}
.pool{border:3px solid transparent;background:linear-gradient(135deg,color-mix(in srgb,var(--c4) 20%,#17114a),color-mix(in srgb,var(--c5) 30%,#17114a)) padding-box,conic-gradient(from var(--ang),#ff3d8b,#ffa62b,#2df5a8,#2ee6ff,#a77bff,#ff3d8b) border-box;animation:spin 7s linear infinite;box-shadow:0 0 40px rgba(167,123,255,.45),0 18px 50px rgba(5,2,30,.55)}
.pool::before{display:none}
@keyframes spin{to{--ang:360deg}}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.ph h2{margin:0}
.pn{font-family:var(--hd);font-size:clamp(34px,5.5vw,46px);line-height:1;background:linear-gradient(90deg,var(--c4),var(--c5),var(--c1));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(46,230,255,.6))}
.pn small{font-family:var(--bd);font-size:15px;color:var(--mut);margin-left:8px;-webkit-text-fill-color:var(--mut)}
.hint{color:var(--mut);margin:0 0 16px;font-weight:800}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.chip{--stub:98px;position:relative;display:flex;align-items:stretch;gap:0;padding:0;min-height:70px;text-align:left;color:#fff;border:0;border-radius:18px;
background:linear-gradient(135deg,color-mix(in srgb,var(--cc,var(--c4)) 26%,#1c1650),#1c1650);
-webkit-mask:radial-gradient(circle 10px at calc(100% - var(--stub)) 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 10px at calc(100% - var(--stub)) 100%,#0000 97%,#000) bottom/100% 51% no-repeat;
mask:radial-gradient(circle 10px at calc(100% - var(--stub)) 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 10px at calc(100% - var(--stub)) 100%,#0000 97%,#000) bottom/100% 51% no-repeat;
box-shadow:inset 7px 0 0 var(--cc,var(--c4))}
.chip>span{flex:1;padding:14px 16px 14px 22px;display:grid;gap:3px;align-content:center;font-weight:800}
.chip small{color:var(--mut);font-size:12px;font-weight:800}
.chip>b{min-width:var(--stub);display:grid;place-items:center;padding:0 10px;border-left:2px dashed rgba(255,255,255,.35);font-family:var(--hd);font-weight:400;font-size:21px;color:var(--cc,var(--c4));text-shadow:0 0 14px var(--cc,var(--c4));white-space:nowrap}
.chip.ok{box-shadow:inset 7px 0 0 var(--cc,var(--c4)),inset 0 0 0 2px var(--cc,var(--c4)),inset 0 0 30px color-mix(in srgb,var(--cc,var(--c4)) 35%,transparent)}
button.chip.ok:hover{transform:translateY(-3px) rotate(-.4deg);filter:brightness(1.2)}
.chip.lk{opacity:.55;filter:saturate(.6)}
.chip.sure{background:var(--cc,var(--c4));color:#07123a}.chip.sure>b{color:#07123a;text-shadow:none}
.chip.ed{-webkit-mask:none;mask:none;gap:6px;padding:8px;align-items:center;box-shadow:inset 7px 0 0 var(--cc,var(--c4))}
.chip.ed input{flex:1;padding:6px 8px}.chip.ed .cost{flex:0 0 70px;text-align:center}
.chip.ed.over{outline:3px dashed var(--c2)}.chip.ed.drag{opacity:.5}
.grip{cursor:grab;touch-action:none;user-select:none;padding:4px 6px;color:var(--mut);font-size:20px;line-height:1}
.cols{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
.ros h2{font-size:17px}
.stu{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:10px;text-align:left;border:1px solid var(--line);border-radius:20px;padding:10px 14px;background:rgba(255,255,255,.07);font-size:18px;font-weight:800}
.stu:hover{transform:translateX(3px)}
.stu .snm{flex:1;overflow:hidden;text-overflow:ellipsis}
.stu.on{background:linear-gradient(135deg,var(--c1),var(--c5));border-color:transparent;box-shadow:0 0 26px rgba(255,61,139,.55)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--cc,var(--c4));color:#07123a;font-weight:900;flex:none;font-size:19px;box-shadow:0 0 16px var(--cc,var(--c4)),inset 0 -3px 0 rgba(0,0,0,.18)}
.addrow{display:flex;gap:8px;margin-top:12px;align-items:center}.addrow input{flex:1}
.gold{background:linear-gradient(135deg,var(--c4),var(--c5));color:#07123a;border:0;font-weight:900;box-shadow:0 0 20px rgba(46,230,255,.45)}
.gold:hover{box-shadow:0 0 30px rgba(167,123,255,.8)}
.card{padding:0}
.card::before{display:none}
.chead{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--c1),var(--c5) 55%,var(--c4));padding:26px 28px 22px;color:#fff}
.chead::after{content:"🎟️";position:absolute;right:18px;top:6px;font-size:84px;opacity:.22;transform:rotate(14deg)}
.cbody{padding:22px 28px 28px}
.nm,.nmi{position:relative;font-family:var(--hd);font-weight:400;font-size:clamp(34px,6vw,56px);margin:0;line-height:1.05;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.35)}
.nmi{width:100%;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.6)}
.csub{position:relative;margin:6px 0 0;color:rgba(255,255,255,.95);font-weight:800}
.facts{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.fact{border-radius:20px;padding:12px 22px;color:#07123a;min-width:118px;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 0 24px rgba(255,61,139,.45)}
.fact:nth-child(2){background:linear-gradient(135deg,var(--c4),var(--c5));box-shadow:0 0 24px rgba(46,230,255,.45)}
.fact:nth-child(3){background:linear-gradient(135deg,var(--c3),var(--c4));box-shadow:0 0 24px rgba(45,245,168,.45)}
.fact b{display:block;font-family:var(--hd);font-weight:400;font-size:30px}.fact span{font-size:12px;font-weight:900}
.card h4{margin:22px 0 10px;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.card .btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.card .btns input{width:100px}.card .btns #sreason{width:auto;flex:1 1 180px}
.card .rm{color:#ff8aa8;background:rgba(255,61,139,.12);border-color:rgba(255,61,139,.45)}
.pick{border:2px dashed var(--c2);border-radius:20px;padding:14px;margin-bottom:14px;background:rgba(255,166,43,.08)}.pick p{margin:4px 0 10px;color:var(--mut)}
.pinrow{margin:0 0 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--mut);font-weight:800}
.pinrow b{font-family:var(--hd);font-weight:400;font-size:20px;color:var(--c4);letter-spacing:.14em;text-shadow:0 0 12px rgba(46,230,255,.7)}.pinrow input{width:90px}
.rm{margin-top:16px}
.presets{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.preset{display:flex;gap:10px;align-items:center;border-radius:99px;padding:10px 18px;background:rgba(255,255,255,.06);border:2px solid var(--cc,var(--c4));color:#fff}
.preset b{font-family:var(--hd);font-weight:400;color:var(--cc,var(--c4))}
.preset:hover{background:var(--cc,var(--c4));color:#07123a;box-shadow:0 0 22px var(--cc,var(--c4));transform:translateY(-2px)}.preset:hover b{color:#07123a}
.pgive{background:rgba(255,255,255,.07);border-radius:22px;padding:16px;margin-bottom:16px;border:1px dashed rgba(255,255,255,.3)}
.pgive b{display:block;margin-bottom:10px}
.prow{display:flex;gap:8px;flex-wrap:wrap}.prow #preason{flex:1 1 220px}.prow #pamt{width:110px}
.sub2{margin:16px 0 10px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.win{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:rgba(255,255,255,.07);border-radius:16px;padding:12px 16px;margin-bottom:8px}
.dsc{display:block}.dsc p{margin:6px 0 0}.dsc input{width:100%;margin-top:6px}
.rhead{display:flex;justify-content:space-between;align-items:center}.rhead .lnk{text-transform:none;letter-spacing:0;font-size:14px}
.log{margin:8px 0 0;padding:0;list-style:none;color:var(--mut);font-size:14px;font-weight:800}.log li{padding:7px 0;border-bottom:1px dashed var(--line)}
.linkrow{display:flex;gap:8px;flex-wrap:wrap}.linkrow input{flex:1 1 260px}
.pins{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.pcard{background:rgba(255,255,255,.08);border-radius:16px;padding:10px 14px;font-weight:800}
.pcard b{font-family:var(--hd);font-weight:400;letter-spacing:.14em;color:var(--c4);font-size:20px;text-shadow:0 0 12px rgba(46,230,255,.7)}
textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px;width:100%;min-height:110px;word-break:break-all}
.auth{position:relative;background:linear-gradient(160deg,rgba(60,38,160,.85),rgba(18,12,64,.92));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#fff;border:2px solid rgba(167,123,255,.7);border-radius:32px;padding:30px;width:min(470px,100%);margin:6vh auto 0;display:grid;gap:14px;justify-items:center;text-align:center;box-shadow:0 0 60px rgba(167,123,255,.5),0 30px 70px rgba(0,0,0,.5)}
.auth>*{justify-self:stretch}
.auth::before{display:none}
.auth h1{margin:0;font-family:var(--hd);font-weight:400;font-size:42px;background:var(--grad);background-size:200% 100%;animation:flow 8s linear infinite;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(167,123,255,.6))}
.auth .mut,.auth .lnk{color:#d6d0ff}.logo{font-size:58px;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(255,61,139,.8))}
.seg{display:flex;width:100%;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(167,123,255,.6);border-radius:20px;padding:8px}
.seg button{flex:1;border:0;background:none;border-radius:14px;padding:14px;font-weight:900;font-size:18px;color:#d6d0ff}
.seg .on{background:linear-gradient(135deg,var(--c1),var(--c5));color:#fff;box-shadow:0 0 22px rgba(255,61,139,.6)}
.nin{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(167,123,255,.6);border-radius:18px;padding:20px 22px;font-size:20px;color:#fff}
.pinin{width:100%;background:#fff;color:#1a1340;border:1px solid #cfc9ff;border-radius:16px;padding:20px 22px;font-size:20px;text-align:left}
.pinin::placeholder{color:#8a84b8}
.show{display:flex;align-items:center;gap:12px;color:#e2deff;font-size:20px;justify-self:start!important}
.show input{width:28px;height:28px;padding:0;accent-color:var(--c4)}
.auth .gold.big{width:100%;border-radius:18px;padding:20px;font-size:22px;background:linear-gradient(135deg,var(--c1),var(--c5));color:#fff;box-shadow:0 0 30px rgba(255,61,139,.6)}
.err{color:#ff9db8;min-height:20px;margin:0;font-weight:900}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:linear-gradient(135deg,var(--c1),var(--c5));color:#fff;font-weight:900;padding:12px 22px;border-radius:99px;z-index:20;display:none;box-shadow:0 0 30px rgba(255,61,139,.6)}
#undo{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;align-items:center;gap:16px;background:#120c3e;color:#fff;border:1px solid rgba(167,123,255,.7);border-radius:99px;padding:8px 8px 8px 24px;font-weight:900;z-index:21;box-shadow:0 0 32px rgba(167,123,255,.55)}
#undo button{background:linear-gradient(135deg,var(--c4),var(--c5));color:#07123a;border:0;border-radius:99px;padding:12px 22px;font-size:16px}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.conf span{position:absolute;top:-40px;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
@media(max-width:780px){.srow{grid-template-columns:100px 1fr 44px}body.ed .srow{grid-template-columns:100px 1fr 44px 52px}.chip{--stub:84px}}

.shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;max-width:1320px;margin:0 auto;padding:18px 16px 48px;align-items:start}
.side{position:sticky;top:14px;display:flex;flex-direction:column;gap:8px;min-height:calc(100vh - 36px);background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04)),rgba(23,17,74,.72);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:30px;padding:18px 14px;box-shadow:0 18px 50px rgba(5,2,30,.55)}
.side .brand{margin:2px 6px 14px;gap:10px}.side .brand .bt{font-size:36px}.side .brand b{font-size:22px}.side .brand small{display:none}
.nv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;border-radius:18px;padding:13px 14px;font-size:17px;color:#e6e2ff}
.nv span{font-size:22px;width:28px;text-align:center}
.nv:hover{background:rgba(255,255,255,.10)}
.nv.on{background:linear-gradient(135deg,var(--c1),var(--c5));color:#fff;box-shadow:0 0 26px rgba(255,61,139,.55)}
.nv.out{color:var(--mut)}
.main{display:grid;gap:18px;min-width:0;align-content:start}
.board{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.tile{grid-column:span 6;margin:0}
.t-pool,.t-give{grid-column:span 12}.t-stand{grid-column:span 7}.t-free,.t-top{grid-column:span 5}.t-recent{grid-column:span 7}.t-me{grid-column:span 4}
.t-free{background:linear-gradient(135deg,rgba(255,166,43,.38),rgba(255,61,139,.32)),rgba(23,17,74,.75)}
.t-top{background:linear-gradient(135deg,rgba(46,230,255,.28),rgba(167,123,255,.30)),rgba(23,17,74,.75)}
.t-me{background:linear-gradient(135deg,rgba(45,245,168,.30),rgba(46,230,255,.28)),rgba(23,17,74,.75)}
.fbig{font-family:var(--hd);font-size:24px;margin:4px 0 8px;line-height:1.15}
.pdi{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.09);border-radius:18px;padding:10px 14px;margin-bottom:10px}.pdi b{flex:1}
.pbar{margin:6px 0 12px}
.pn.big{font-size:56px}
.main>.panel{margin:0}
@media(max-width:1100px){.cols{grid-template-columns:1fr}}
